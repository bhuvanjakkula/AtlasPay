services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: atlas, POSTGRES_PASSWORD: atlas_dev_only, POSTGRES_DB: atlas}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U atlas"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","","--appendonly","no"]
    ports: ["6379:6379"]
